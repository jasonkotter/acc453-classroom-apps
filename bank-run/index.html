<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a35">
  <meta name="description" content="A classroom bank-run game: hold or withdraw, and see what the class did to the bank.">
  <title>Bank Run · ACC 453</title>
  <link rel="stylesheet" href="../_shared/classroom.css?v=20261124d">
  <style>
    :root{--hold:#2a78d6;--wd:#eb6834}
    .taccount p.minor{color:var(--muted);font-size:.86em}
    .tile.out{background:#fff;border:1px dashed #9fb0ae}
    .headline{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:14px;margin:12px 0;background:var(--mint)}
    .headline.short{background:var(--amber)}.headline.closed{background:var(--rose)}
    .headline .icon{font-size:2rem;line-height:1;font-weight:900}
    .headline b{display:block;font-size:1.35rem;letter-spacing:-.02em;line-height:1.2}
    .stack{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;background:#fff;margin:8px 0 6px}
    .stack i{display:block;min-width:2px}
    .meter{position:relative;height:38px;border-radius:9px;background:#e4eae7;margin:30px 0 32px}
    .meter .fill{position:absolute;inset:0 auto 0 0;background:var(--wd);border-radius:9px 0 0 9px;max-width:100%}
    .meter .mk{position:absolute;top:-7px;bottom:-7px;width:0;border-left:2px dashed var(--ink)}
    .meter .mk span{position:absolute;left:6px;white-space:nowrap;font-size:.8rem;font-weight:750;font-style:normal}
    .meter .mk.left span{left:auto;right:6px}
    .meter .mk.up span{top:-17px}.meter .mk.down span{bottom:-18px}
    .hist{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:10px 0 4px}
    .hcol{text-align:center}
    .hbar{height:64px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
    .hbar i{display:block;border-radius:2px}
    .hcol small{display:block;font-size:.68rem;color:var(--muted);line-height:1.2;margin-top:3px}
    .hcol.act small{font-weight:800;color:var(--ink)}
    .chips{grid-template-columns:repeat(6,1fr)}
    .choice b{font-size:1.35rem}
  </style>
</head>
<body>
  <p style="padding:20px">Loading…</p>
  <script src="../_shared/config.js?v=20261124d"></script>
  <script src="../_shared/local.js?v=20261124d"></script>
  <script src="../_shared/classroom.js?v=20261124d"></script>
  <script src="model.js?v=20261124d"></script>
  <script src="game.js?v=20261124d"></script>
</body>
</html>
